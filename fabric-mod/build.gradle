plugins {
 id 'fabric-loom' version '1.6.12'
}
version = project.version
group = project.group
base { archivesName = 'mc-flash-bridge' }
loom { splitEnvironmentSourceSets(); mods { modid { sourceSet sourceSets.main; sourceSet sourceSets.client } } }
dependencies {
 minecraft "com.mojang:minecraft:${project.minecraft_version}"
 mappings loom.officialMojangMappings()
 modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
tasks.withType(JavaCompile).configureEach { it.options.release = 17 }
java { sourceCompatibility=JavaVersion.VERSION_17; targetCompatibility=JavaVersion.VERSION_17 }

loom { runs { client { programArgs "--username", "Steve", "--quickPlaySingleplayer", "MC Dad n Me Bridge", "--width", "640", "--height", "480" } } }
